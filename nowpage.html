          clearTimeout(timer);
          if (done) return;
          if (!d || !d.elements) throw new Error("bad");
          done = true; stopAll(); resolve(d);
        })
        .catch(function(){
          clearTimeout(timer);
          if (--left === 0 && !done) reject(new Error("all failed"));
        });
    });
  });
}

var seq = 0;
function search(){
  cur.kw = $("kw").value.trim();
  try{ localStorage.setItem("nowpage", JSON.stringify({area:cur.area, cat:cur.cat})); }catch(e){}
  var my = ++seq;
  rows = []; shown = 0;
  $("list").innerHTML = ""; $("more").style.display = "none"; $("count").textContent = "";
  $("state").innerHTML = '<div class="msg"><div class="spin"></div>' + esc(cur.area) + '周辺を検索しています…<br><span style="font-size:12px;color:var(--tx3)">初回は10秒ほどかかることがあります</span></div>';
  var q = buildQuery(), key = "np2:" + q, cached = null;
  try{
    var c = JSON.parse(localStorage.getItem(key) || "null");
    if (c && Date.now() - c.t < 7 * 864e5) cached = c.d;
  }catch(e){}
  var p = cached ? Promise.resolve(cached) : fetchOverpass(q).then(function(d){
    var slim = {elements:(d.elements || []).map(function(x){ return {lat:x.lat, lon:x.lon, center:x.center, tags:x.tags}; })};
    try{ localStorage.setItem(key, JSON.stringify({t:Date.now(), d:slim})); }catch(e){ try{ Object.keys(localStorage).forEach(function(k){ if (k.indexOf("np2:") === 0) localStorage.removeItem(k); }); }catch(_){} }
    return slim;
  });
  p.then(function(d){
    if (my !== seq) return;
    rows = toRows(d.elements || []);
    $("state").innerHTML = "";
    render();
  }).catch(function(){
    if (my !== seq) return;
    $("state").innerHTML = '<div class="msg">検索サーバーが混み合っていて、つながりませんでした。<br><button class="more" style="width:auto;display:inline-block;margin-top:12px;padding:10px 22px" onclick="search()">もう一度探す</button></div>';
  });
}

/* ===== データ整形 ===== */
function tel(t){
  var p = t.phone || t["contact:phone"] || t.mobile || t["contact:mobile"] || "";
  p = p.split(";")[0].trim();
  if (!p) return "";
  p = p.replace(/^\+81[\s-]?/, "0").replace(/^0\(?0?/, "0").replace(/[()]/g, "").replace(/\s+/g, "-");
  return p;
}
function addr(t){
  if (t["addr:full"]) return t["addr:full"];
  var a = [t["addr:province"], t["addr:city"], t["addr:suburb"], t["addr:quarter"], t["addr:neighbourhood"]].filter(Boolean).join("");
  var n = [t["addr:block_number"], t["addr:housenumber"]].filter(Boolean).join("-");
  return (a + n) || (t["addr:street"] ? t["addr:street"] + (t["addr:housenumber"] || "") : "");
}
var CUISINE = {ramen:"ラーメン",sushi:"寿司",udon:"うどん",soba:"そば",yakiniku:"焼肉",yakitori:"焼き鳥",izakaya:"居酒屋",japanese:"和食",chinese:"中華",korean:"韓国料理",italian:"イタリアン",french:"フレンチ",pizza:"ピザ",curry:"カレー",burger:"ハンバーガー",tempura:"天ぷら",tonkatsu:"とんかつ",okonomiyaki:"お好み焼き",takoyaki:"たこ焼き",motsunabe:"もつ鍋",gyoza:"餃子",coffee_shop:"喫茶",cake:"ケーキ",steak_house:"ステーキ",seafood:"海鮮",noodle:"麺類",beef_bowl:"牛丼",donut:"ドーナツ",chicken:"チキン"};
function kind(t){
  var v = t.amenity || t.shop || t.healthcare || t.office || t.tourism || t.leisure || "";
  var k = KIND[v] || "";
  if (t.cuisine){
    var c = t.cuisine.split(";").map(function(x){ return CUISINE[x.trim()]; }).filter(Boolean).join("・");
    if (c) k = c;
  }
  return k;
}
function hours(h){
  if (!h) return "";
  return h.replace(/Mo/g,"月").replace(/Tu/g,"火").replace(/We/g,"水").replace(/Th/g,"木").replace(/Fr/g,"金").replace(/Sa/g,"土").replace(/Su/g,"日").replace(/PH/g,"祝").replace(/off/g,"休").replace(/;\s*/g,"／");
}
function toRows(els){
  var seen = {}, out = [];
  els.forEach(function(e){
    var t = e.tags || {}; var nm = t.name; if (!nm) return;
    var lat = e.lat || (e.center && e.center.lat), lon = e.lon || (e.center && e.center.lon);
    var k = nm + "|" + (lat ? lat.toFixed(3) : "");
    if (seen[k]) return; seen[k] = 1;
    out.push({txt:(nm + " " + (t["name:ja-Hira"]||"") + " " + (t["name:ja-Kana"]||"") + " " + kind(t) + " " + addr(t)).toLowerCase(), name:nm, branch:t["branch"] || "", kind:kind(t), ad:addr(t), tel:tel(t), hr:hours(t.opening_hours), web:t.website || t["contact:website"] || "", lat:lat, lon:lon});
  });
  out.sort(function(a, b){
    if (!!b.tel !== !!a.tel) return b.tel ? 1 : -1;
    return a.name.localeCompare(b.name, "ja");
  });
  return out;
}

/* ===== 表示 ===== */
function showPR(){
  var cat = CATS.filter(function(x){ return x.id === cur.cat; })[0];
  return cat.pr || /代行|運転|飲み|送迎/.test(cur.kw);
}
function item(r, isPR){
  var h = '<div class="it' + (isPR ? ' pr' : '') + '">';
  h += '<div class="nm">' + (isPR ? '<span class="badge">PR</span>' : '') + esc(r.name) + (r.branch ? ' ' + esc(r.branch) : '') + (r.kind ? '<span class="kd">' + esc(r.kind) + '</span>' : '') + '</div>';
  if (r.ad) h += '<div class="ad">' + esc(r.ad) + '</div>';
  if (r.hr) h += '<div class="hr">' + esc(r.hr) + '</div>';
  h += '<div class="acts">';
  if (r.tel) h += '<a class="tel" href="tel:' + esc(r.tel.replace(/[^0-9+]/g, "")) + '">📞 ' + esc(r.tel) + '</a>';
  if (r.lat) h += '<a href="https://www.google.com/maps/search/?api=1&query=' + r.lat + ',' + r.lon + '" target="_blank" rel="noopener">地図</a>';
  if (r.web && /^https?:\/\//.test(r.web)) h += '<a href="' + esc(r.web) + '" target="_blank" rel="noopener">サイト</a>';
  h += '</div></div>';
  return h;
}
function render(){
  var tk = tokens().map(function(x){ return x.toLowerCase(); });
  var list = rows.filter(function(r){
    if ($("telOnly").checked && !r.tel) return false;
    for (var i = 0; i < tk.length; i++) if (r.txt.indexOf(tk[i]) < 0) return false;
    return true;
  });
  var h = "";
  if (shown === 0 && showPR()) h += item(PR, true);
  list.slice(shown, shown + PAGE).forEach(function(r){ h += item(r, false); });
  $("list").insertAdjacentHTML("beforeend", h);
  shown += PAGE;
  $("count").textContent = esc(cur.area) + "　" + list.length + "件";
  $("more").style.display = shown < list.length ? "block" : "none";
  if (!list.length && !showPR()) $("state").innerHTML = '<div class="msg">見つかりませんでした。<br>地域や業種を変えてお試しください。</div>';
}

/* 全部の準備ができてから起動 */
init();
</script>
