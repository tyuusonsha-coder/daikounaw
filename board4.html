<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>案件掲示板｜代行なう</title>
<style>
:root{
  --bg:#0B1220;
  --surface:#142338;
  --surface-2:#1B2E48;
  --line:#22385A;
  --text:#E8EEF7;
  --muted:#8FA3BF;
  --amber:#FFB020;
  --green:#2ECC71;
  --red:#FF5A5A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  font-feature-settings:"palt";
  padding-bottom:env(safe-area-inset-bottom);
}
.bar{
  position:sticky;top:0;z-index:10;
  background:rgba(11,18,32,.92);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  display:flex;align-items:center;gap:12px;
}
.brand{font-size:15px;font-weight:800;letter-spacing:.04em}
.brand span{color:var(--muted);font-weight:600;font-size:12px;display:block;margin-top:2px}
.toggle{
  border:0;border-radius:999px;
  padding:11px 18px;font-size:14px;font-weight:800;
  font-family:inherit;cursor:pointer;transition:.15s;
}
.bell{
  margin-left:auto;border:1px solid var(--line);border-radius:999px;
  background:var(--surface-2);font-size:17px;line-height:1;
  padding:10px 13px;cursor:pointer;font-family:inherit;
}
.bell.on{border-color:var(--amber);background:rgba(255,176,32,.14)}
.toggle{margin-left:10px}
.toggle.on{background:var(--green);color:#06210F}
.toggle.off{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.meta{
  padding:9px 16px;font-size:12px;color:var(--muted);
  display:flex;align-items:center;gap:7px;
  border-bottom:1px solid var(--line);
}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.list{padding:14px 12px 40px;display:flex;flex-direction:column;gap:12px}

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
  display:flex;
  animation:in .25s ease-out;
}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* 経過時間レール：古い案件ほど赤くなる */
.rail{width:6px;flex:none;background:var(--green);transition:background .4s}
.body{flex:1;min-width:0;padding:14px 15px 15px}

.age{
  font-size:12px;font-weight:700;letter-spacing:.03em;
  font-variant-numeric:tabular-nums;
  color:var(--muted);margin-bottom:10px;
  display:flex;align-items:center;gap:8px;
}
.age b{color:var(--text)}
.tag{
  font-size:11px;font-weight:800;padding:3px 8px;border-radius:5px;
  background:var(--surface-2);color:var(--muted);border:1px solid var(--line);
}
.route{display:flex;flex-direction:column;gap:9px;margin-bottom:13px}
.pt{display:flex;gap:10px;align-items:flex-start}
.pin{
  flex:none;width:20px;text-align:center;font-size:12px;font-weight:800;
  padding-top:2px;
}
.pin.a{color:var(--amber)}
.pin.b{color:var(--muted)}
.addr{font-size:16px;font-weight:700;line-height:1.4;word-break:break-word}
.stats{
  display:flex;align-items:baseline;gap:14px;
  padding-top:12px;border-top:1px solid var(--line);margin-bottom:13px;
}
.yen{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.yen small{font-size:14px;font-weight:700;margin-left:1px}
.km{font-size:13px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.take{
  width:100%;border:0;border-radius:12px;
  background:var(--amber);color:#241400;
  font-family:inherit;font-size:17px;font-weight:800;letter-spacing:.03em;
  padding:16px;cursor:pointer;transition:.12s;
}
.take:active{transform:scale(.98)}
.take:disabled{background:var(--surface-2);color:var(--muted);cursor:default;transform:none}

.empty{padding:80px 30px;text-align:center}
.empty h2{font-size:17px;font-weight:700;margin:0 0 8px;color:var(--muted)}
.empty p{font-size:13px;color:var(--muted);opacity:.7;margin:0;line-height:1.7}
.scan{
  width:44px;height:44px;margin:0 auto 22px;border-radius:50%;
  border:2px solid var(--line);border-top-color:var(--amber);
  animation:spin 1.1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.paused .scan{animation:none;border-top-color:var(--line)}

.toast{
  position:fixed;left:12px;right:12px;bottom:calc(18px + env(safe-area-inset-bottom));
  background:var(--surface-2);border:1px solid var(--line);
  border-radius:12px;padding:15px 16px;
  font-size:14px;font-weight:700;line-height:1.5;
  z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.5);
  opacity:0;transform:translateY(12px);pointer-events:none;transition:.2s;
}
.toast.show{opacity:1;transform:none}
.toast.err{border-color:var(--red);color:var(--red)}
.toast.ok{border-color:var(--green);color:var(--green)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="bar">
  <div class="brand">案件掲示板<span id="coName">代行なう運転代行</span></div>
  <button class="bell off" id="bell" title="通知音">🔕</button>
  <button class="toggle off" id="toggle">受付停止中</button>
</div>

<div class="meta"><div class="dot" id="dot"></div><span id="metaText">接続中…</span></div>

<div class="list" id="list"></div>

<div class="toast" id="toast"></div>

<script>
// ▼▼ 設定 ▼▼
var SB = "https://kjfmcpwstubgezebmstt.supabase.co/rest/v1/";
var RPC = "https://kjfmcpwstubgezebmstt.supabase.co/rest/v1/rpc/";
var SK = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtqZm1jcHdzdHViZ2V6ZWJtc3R0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1ODU3MTksImV4cCI6MjA5NDE2MTcxOX0.GF5QPVI4AUCfIqdmApplwOAEDBoESZTfadi-hbOb7Gs";
var COMPANY_ID = "daikounaw";
// ▲▲ 設定ここまで ▲▲

var H = {"apikey":SK,"Authorization":"Bearer "+SK,"Content-Type":"application/json","Prefer":"return=representation"};
var $ = function(id){ return document.getElementById(id); };
var orders = [], isOpen = false, busy = null;

function toast(msg, type){
  var t = $('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (type || '');
  clearTimeout(t._t);
  t._t = setTimeout(function(){ t.className = 'toast'; }, 3200);
}
function minsAgo(iso){
  return Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 60000));
}
function railColor(m){
  if (m < 3) return 'var(--green)';
  if (m < 8) return 'var(--amber)';
  return 'var(--red)';
}
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
}

function render(){
  var list = $('list');
  if (!orders.length){
    list.innerHTML =
      '<div class="empty' + (isOpen ? '' : ' paused') + '">' +
      '<div class="scan"></div>' +
      '<h2>' + (isOpen ? '注文を探しています' : '受付を停止しています') + '</h2>' +
      '<p>' + (isOpen ? '新しい案件が入ると自動で表示されます。' : '受付を開始すると案件が届きます。') + '</p></div>';
    return;
  }
  list.innerHTML = orders.map(function(o){
    var m = minsAgo(o.created_at);
    var price = o.price ? o.price.toLocaleString() + '<small>円</small>' : '<small>距離で計算</small>';
    return '<div class="card">' +
      '<div class="rail" style="background:' + railColor(m) + '"></div>' +
      '<div class="body">' +
        '<div class="age"><b>' + m + '分前</b>の依頼' +
          (o.km ? '<span class="tag">' + o.km + 'km</span>' : '') + '</div>' +
        '<div class="route">' +
          '<div class="pt"><div class="pin a">出発</div><div class="addr">' + esc(o.pickup) + '</div></div>' +
          '<div class="pt"><div class="pin b">到着</div><div class="addr">' + esc(o.dropoff) + '</div></div>' +
        '</div>' +
        '<div class="stats">' +
          '<div class="yen">' + price + '</div>' +
          '<div class="km">' + esc(o.cname || 'お客様') + '</div>' +
        '</div>' +
        '<button class="take" data-id="' + o.id + '"' + (busy === o.id ? ' disabled' : '') + '>' +
          (busy === o.id ? '受注しています…' : 'この案件を受注する') + '</button>' +
      '</div></div>';
  }).join('');
  var btns = list.querySelectorAll('.take');
  for (var i = 0; i < btns.length; i++){
    (function(b){ b.onclick = function(){ accept(b.getAttribute('data-id')); }; })(btns[i]);
  }
}

var soundOn = false, audioCtx = null, knownIds = null;

function enableSound(){
  soundOn = !soundOn;
  var b = $('bell');
  b.className = 'bell ' + (soundOn ? 'on' : 'off');
  b.textContent = soundOn ? '🔔' : '🔕';
  if (soundOn){
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      beep(0.06);
      toast('新しい案件が入ると音で知らせます', 'ok');
    } catch(e){ toast('この端末では音を出せません', 'err'); }
  }
}

function beep(vol){
  if (!audioCtx) return;
  var t = audioCtx.currentTime;
  [0, 0.28, 0.56].forEach(function(offset){
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(880, t + offset);
    o.frequency.setValueAtTime(1320, t + offset + 0.1);
    g.gain.setValueAtTime(0, t + offset);
    g.gain.linearRampToValueAtTime(vol || 0.35, t + offset + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t + offset + 0.22);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t + offset); o.stop(t + offset + 0.24);
  });
}

function alertNew(n){
  if (soundOn){
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    beep(0.4);
  }
  if (navigator.vibrate) navigator.vibrate([400, 150, 400, 150, 400]);
  document.title = '🔔 新着' + n + '件｜案件掲示板';
  toast('新しい案件が' + n + '件入りました', 'ok');
}

async function load(){
  try {
    var r = await fetch(SB + 'orders?status=eq.open&order=created_at.desc', {headers:H});
    var data = await r.json();
    orders = Array.isArray(data) ? data : [];

    var ids = orders.map(function(o){ return o.id; });
    if (knownIds !== null){
      var fresh = ids.filter(function(id){ return knownIds.indexOf(id) === -1; });
      if (fresh.length) alertNew(fresh.length);
    }
    knownIds = ids;
    if (!orders.length) document.title = '案件掲示板｜代行なう';
    $('metaText').textContent = '募集中 ' + orders.length + '件・自動更新';
    render();
  } catch(e){
    $('metaText').textContent = '読み込みに失敗しました';
  }
}

async function accept(id){
  if (busy) return;
  if (!confirm('この案件を受注します。よろしいですか？')) return;
  busy = id; render();
  try {
    var r = await fetch(RPC + 'accept_order', {
      method:'POST', headers:H,
      body: JSON.stringify({ p_order_id:id, p_company_id:COMPANY_ID })
    });
    busy = null;
    if (r.ok){
      toast('受注しました。配車画面に反映されています', 'ok');
    } else {
      var t = await r.text();
      toast(t.indexOf('他社') >= 0 ? '他社が先に受注しました' : '受注できませんでした', 'err');
    }
  } catch(e){
    busy = null;
    toast('通信に失敗しました', 'err');
  }
  load();
}

async function loadCompany(){
  try {
    var r = await fetch(SB + 'companies?id=eq.' + COMPANY_ID + '&select=name,is_open', {headers:H});
    var d = await r.json();
    if (d && d[0]){
      $('coName').textContent = d[0].name;
      isOpen = !!d[0].is_open;
      paintToggle();
    }
  } catch(e){}
}
function paintToggle(){
  var b = $('toggle');
  b.className = 'toggle ' + (isOpen ? 'on' : 'off');
  b.textContent = isOpen ? '受付中' : '受付停止中';
  $('dot').style.background = isOpen ? 'var(--green)' : 'var(--muted)';
}
$('toggle').onclick = async function(){
  isOpen = !isOpen;
  paintToggle(); render();
  try {
    await fetch(SB + 'companies?id=eq.' + COMPANY_ID, {
      method:'PATCH', headers:H,
      body: JSON.stringify({ is_open:isOpen, free_cars:isOpen ? 1 : 0, status_updated_at:new Date().toISOString() })
    });
  } catch(e){ toast('状態を保存できませんでした', 'err'); }
};

$('bell').onclick = enableSound;

loadCompany();
load();
setInterval(load, 5000);
</script>
</body>
</html>
