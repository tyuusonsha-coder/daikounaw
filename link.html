<style>
  :root{
    --night:#0F1626;
    --surface:#1A2438;
    --surface-lift:#22304A;
    --lamp:#E0A54B;
    --lamp-deep:#B37F2E;
    --paper:#F2EFE8;
    --muted:#8791A3;
    --line-green:#06C755;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{
    background:var(--night);
    color:var(--paper);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    line-height:1.6;
    min-height:100vh;
    padding:0 20px 48px;
  }
  .glow{
    position:fixed; top:0; left:0; right:0; height:180px;
    background:radial-gradient(60% 100% at 50% 0%, rgba(224,165,75,.18), transparent 70%);
    pointer-events:none; z-index:0;
  }
  .wrap{ max-width:440px; margin:0 auto; position:relative; z-index:1; }

  header{ padding:52px 0 34px; text-align:center; }
  .eyebrow{
    font-size:11px; letter-spacing:.22em; color:var(--lamp);
    margin-bottom:14px;
  }
  h1{
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    font-size:27px; font-weight:600; letter-spacing:.06em;
  }
  .thanks{
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    font-size:14px; color:var(--muted); margin-top:12px; letter-spacing:.04em;
  }
  .rule{
    width:44px; height:2px; background:var(--lamp);
    margin:26px auto 0; border-radius:2px;
  }

  .lead{
    font-size:13px; color:var(--muted);
    text-align:center; margin:30px 0 14px;
  }

  a.item{
    display:flex; align-items:center; gap:14px;
    background:var(--surface);
    border:1px solid rgba(255,255,255,.07);
    border-radius:14px;
    padding:17px 18px;
    margin-bottom:11px;
    text-decoration:none; color:var(--paper);
    transition:background .18s ease, transform .18s ease;
  }
  a.item:hover, a.item:focus-visible{
    background:var(--surface-lift); transform:translateY(-1px);
  }
  a.item:focus-visible{ outline:2px solid var(--lamp); outline-offset:3px; }

  .icon{
    width:42px; height:42px; flex:0 0 42px;
    border-radius:11px;
    display:grid; place-items:center;
    font-size:19px;
    background:rgba(255,255,255,.06);
  }
  .txt{ flex:1; min-width:0; }
  .ttl{ font-size:15px; font-weight:700; letter-spacing:.01em; }
  .sub{ font-size:11.5px; color:var(--muted); margin-top:2px; }
  .arrow{ color:var(--muted); font-size:15px; flex:0 0 auto; }

  /* 主役：クチコミ */
  a.primary{
    background:linear-gradient(135deg, var(--lamp) 0%, var(--lamp-deep) 100%);
    border:none; color:#16202F;
    padding:21px 18px;
    box-shadow:0 8px 26px rgba(224,165,75,.22);
  }
  a.primary:hover, a.primary:focus-visible{
    background:linear-gradient(135deg,#EBB25C 0%,#C08B34 100%);
  }
  a.primary .icon{ background:rgba(0,0,0,.13); }
  a.primary .ttl{ font-size:16.5px; }
  a.primary .sub{ color:rgba(22,32,47,.72); }
  a.primary .arrow{ color:rgba(22,32,47,.6); }

  a.line .icon{ background:rgba(6,199,85,.16); }

  .divider{
    display:flex; align-items:center; gap:12px;
    margin:30px 0 16px; color:var(--muted); font-size:11px; letter-spacing:.14em;
  }
  .divider::before, .divider::after{
    content:""; flex:1; height:1px; background:rgba(255,255,255,.1);
  }

  .callbar{
    margin-top:28px;
    background:var(--surface);
    border:1px solid rgba(255,255,255,.07);
    border-radius:14px;
    padding:18px;
    text-align:center;
  }
  .callbar a{
    font-size:23px; font-weight:700; color:var(--lamp);
    text-decoration:none; letter-spacing:.03em;
  }
  .callbar .hours{ font-size:11.5px; color:var(--muted); margin-top:7px; }

  .notice{
    margin-top:26px;
    background:rgba(224,165,75,.07);
    border:1px solid rgba(224,165,75,.22);
    border-radius:14px;
    padding:17px 18px;
  }
  .notice h2{
    font-size:12.5px; font-weight:700; color:var(--lamp);
    letter-spacing:.04em; margin-bottom:9px;
  }
  .notice p{
    font-size:12px; color:#C6CCD8; line-height:1.85;
  }

  footer{
    text-align:center; margin-top:34px;
    font-size:10.5px; color:var(--muted); line-height:1.8;
  }

  @media (prefers-reduced-motion: reduce){
    a.item{ transition:none; }
    a.item:hover{ transform:none; }
  }
</style>
</head>
