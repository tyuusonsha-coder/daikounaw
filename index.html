function ago(v){var t=tms(v);if(!t)return "";var s=Math.floor((Date.now()-t)/1000);if(s<0)s=0;return s<60?"たった今":s<3600?Math.floor(s/60)+"分前":s<86400?Math.floor(s/3600)+"時間前":Math.floor(s/86400)+"日前"}
function fmtDT(v){var t=tms(v);if(!t)return "";var d=new Date(t);return (d.getMonth()+1)+"/"+d.getDate()+" "+("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)}

var map=null, marks={};
function initMap(){
  if(map||typeof L==="undefined")return;
  map=L.map("map",{zoomControl:false,attributionControl:false}).setView(HOME_LL,13);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19}).addTo(map);
  L.control.attribution({prefix:false}).addAttribution("&copy; OpenStreetMap contributors").addTo(map);
  L.control.zoom({position:"bottomright"}).addTo(map);
}
function pinIcon(no,lv){
  var col=lv?"#00D26A":"#8FA3BF";
  return L.divIcon({className:"",iconSize:[26,26],iconAnchor:[13,13],
    html:'<div class="pin" style="background:'+col+';color:'+(lv?"#03210f":"#101018")+'">'+no+'</div>'});
}
function paintMap(){
  if(!map)return;
  var shown=ranked().filter(function(c){return c.lat&&c.lng}).slice(0,12);
  var keep={};
  shown.forEach(function(c,i){
    keep[c.id]=1;
    var lv=isFree(c), ic=pinIcon(i+1,lv);
    if(marks[c.id]){marks[c.id].setLatLng([c.lat,c.lng]);marks[c.id].setIcon(ic)}
    else{
      marks[c.id]=L.marker([c.lat,c.lng],{icon:ic}).addTo(map);
      marks[c.id].on("click",(function(id){return function(){selectCo(id,true)}})(c.id));
    }
  });
  for(var k in marks){if(!keep[k]){map.removeLayer(marks[k]);delete marks[k]}}
  $("maplabel").textContent = shown.length? "更新の新しい業者 "+shown.length+"社を表示中" : "地図に表示できる業者がまだありません";
  if(shown.length&&!myLL){
    try{map.fitBounds(L.latLngBounds(shown.map(function(c){return [c.lat,c.lng]})).pad(0.35))}catch(e){}
  }
}
function findNear(){
  if(!navigator.geolocation){alert("お使いの端末では現在地を取得できません。");return}
  $("maplabel").textContent="現在地を取得しています…";
  navigator.geolocation.getCurrentPosition(function(p){
    myLL=[p.coords.latitude,p.coords.longitude];
    if(map){map.setView(myLL,14);
      L.circleMarker(myLL,{radius:7,color:"#00e5ff",fillColor:"#00e5ff",fillOpacity:.9,weight:2}).addTo(map);}
    paintCoList();
    $("maplabel").textContent="現在地から近い順に並べ替えました";
  },function(){
    $("maplabel").textContent="現在地を取得できませんでした";
    alert("現在地を取得できませんでした。位置情報の許可をご確認ください。");
  },{enableHighAccuracy:true,timeout:9000});
}
function hav(a,b){
  var R=6371,dLat=(b[0]-a[0])*Math.PI/180,dLon=(b[1]-a[1])*Math.PI/180;
  var s=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
  return R*2*Math.atan2(Math.sqrt(s),Math.sqrt(1-s));
}

/* ===================== 業者 ===================== */
function isOwnCo(co){return co&&co.id===OFF_CO}
function isOffCo(co){return OFF>0&&isOwnCo(co)}
function isFree(c){return !!(c.is_open&&(c.free_cars||0)>0)}
function upAt(c){return tms(c.updated_at)||tms(c.created_at)}
function coFare(co,k){
  var n=Math.ceil(k),f;
  if(isOwnCo(co)){
    f=(co.base_fare||0)+Math.min(n,10)*(co.per_km||0);
    if(n>10)f+=Math.min(n-10,10)*KM2;
    if(n>20)f+=(n-20)*KM3;
  }else{
    f=(co.base_fare||0)+n*(co.per_km||0);
  }
  if(isOffCo(co))f=Math.max(0,f-OFF);
  return f;
}
function matchArea(c){
  if(!areaFilter||areaFilter==="全て")return true;
  var s=(c.pref||"")+" "+(c.area||"");
  if(s.indexOf(areaFilter)>=0)return true;
  var m=areaFilter.replace("福岡市","");
  return areaFilter.indexOf("福岡市")===0 && s.indexOf(m)>=0;
}
/* 並び順：空車 → 受付中 → 更新が新しい順。現在地があれば距離を優先 */
function ranked(){
  var a=companies.filter(matchArea);
  a.sort(function(x,y){
    var xf=isFree(x)?0:(x.is_open?1:2), yf=isFree(y)?0:(y.is_open?1:2);
    if(xf!==yf)return xf-yf;
    if(myLL&&x.lat&&x.lng&&y.lat&&y.lng){
      var d=hav(myLL,[x.lat,x.lng])-hav(myLL,[y.lat,y.lng]);
      if(Math.abs(d)>0.05)return d;
    }
    return upAt(y)-upAt(x);
  });
  return a;
}

    if(c.base_fare||c.per_km)o+='<div class="co-f">'+((c.base_fare>0)?'初乗り'+yen(c.base_fare)+' · ':'')+'1km'+yen(c.per_km||0)+'</div>';

    o+='<a class="b-go" href="yobu.html?co='+encodeURIComponent(c.id)+'" onclick="event.stopPropagation()">🚖 呼ぶ</a>';
    o+='</div></div>';
    return o;
  }).join("");
}

    o+='<div style="font-size:12px;color:#777;margin-bottom:6px;line-height:1.5"><span style="color:#00e5ff;font-weight:900">No.'+noMap[p.id]+'</span>　<b style="color:'+(isC?"#4A90FF":"#FF6B00")+'">'+h(p.name||"名無しさん")+'</b>【'+(isC?"🍺お客":"🚘運転手")+'】'+(hot?'<span class="hot">🔥炎上</span>':'')+(isMe?' <span style="color:#444">あなた</span>':'')+'<span style="float:right;color:#666">'+when(p.created_at)+'</span></div>';
    o+='<div style="font-size:14.5px;color:#ddd;line-height:1.75;word-break:break-word">'+h(p.text)+'</div>';
    if(reps.length){
      o+='<div style="margin-top:8px;border-left:2px solid #24242e;padding-left:10px">';
      reps.forEach(function(r,ri){o+='<div style="margin-bottom:5px;font-size:12px;color:#888;line-height:1.6"><span style="color:#555">└'+(ri+1)+'</span> <b style="color:'+(r.role==="customer"?"#4A90FF":"#FF6B00")+'">'+h(r.name||"名無しさん")+'</b>：<span style="color:#aaa">'+h(r.text)+'</span></div>'});
      o+='</div>';
    }
    o+='<div class="rxn">';
    [["fire","🔥"],["agree","💪"],["funny","😂"],["heart","❤️"]].forEach(function(rx){
      var cnt=(p.reactions||{})[rx[0]]||0, on=myR===rx[0];
      o+='<button class="'+(on?"on":"")+'" onclick="doReact(\''+p.id+'\',\''+rx[0]+'\')">'+rx[1]+(cnt>0?'<span>'+cnt+'</span>':'')+'</button>';
    });
    o+='<button onclick="replyId=replyId===\''+p.id+'\'?null:\''+p.id+'\';replyTxt=\'\';paintBattle()">💬 レス'+(reps.length>0?' '+reps.length:'')+'</button>';
    o+='<button onclick="share(\''+p.id+'\')">📤</button>';
    if(isMe)o+='<button onclick="delPost(\''+p.id+'\')" style="margin-left:auto">🗑</button>';
    o+='</div>';
    if(replyId===p.id)o+='<div class="reply-box"><input id="rtxt" placeholder="No.'+noMap[p.id]+'にレス…"><button class="btn-sub" onclick="replyTxt=document.getElementById(\'rtxt\').value;doReply(\''+p.id+'\')">送信</button></div>';
    o+='</div>';
  });
  o+='<div style="padding:16px;text-align:center"><button class="btn-sub" onclick="toggleBattle()" style="background:#16161c;color:#888">← ホームに戻る</button></div>';
  $("battle").innerHTML=o;
}
function bbsWrite(){
  bbsName=$("bname").value.trim(); lsSet("dn_name",bbsName);
  role=$("brole").value; lsSet("dn_role",role);
  compTxt=$("ctxt").value;
  if(!compTxt.trim()){alert("本文を入力してください");return}
  submitPost();
}
async function submitPost(){
  if(!compTxt.trim())return;
  await sbPost("posts",{id:"p"+Date.now()+Math.random().toString(36).slice(2,5),role:role,uid:uid,name:bbsName,text:compTxt.trim(),reactions:{},reacted_by:{},created_at:Date.now()});
  compTxt="";loadPosts();
}
async function doReact(pid,key){
  var p=posts.filter(function(x){return x.id===pid})[0];if(!p)return;
  var rb=Object.assign({},p.reacted_by||{}), rs=Object.assign({},p.reactions||{});
  var prev=rb[uid];
  if(prev===key){delete rb[uid];rs[key]=Math.max(0,(rs[key]||1)-1)}
  else{if(prev)rs[prev]=Math.max(0,(rs[prev]||1)-1);rb[uid]=key;rs[key]=(rs[key]||0)+1}
  await sbPatch("posts",pid,{reactions:rs,reacted_by:rb});loadPosts();
}
async function doReply(pid){
  if(!replyTxt.trim())return;
  await sbPost("replies",{id:"r"+Date.now()+Math.random().toString(36).slice(2,5),post_id:pid,role:role,uid:uid,name:bbsName,text:replyTxt.trim(),created_at:Date.now()});
  replyTxt="";replyId=null;loadPosts();
}
async function delPost(pid){await sbDel("posts",pid);loadPosts()}
function share(pid){
  var p=posts.filter(function(x){return x.id===pid})[0];if(!p)return;
  var rc=p.role==="customer"?"🍺お客":"🚘運転手";
  var t=rc+"「"+p.text.slice(0,60)+"」\n\n⚔️ お客 vs 運転手 バトル中！\n#代行なう\nhttps://daikounaw.com";
  if(navigator.share)navigator.share({text:t}).catch(function(){});
  else window.open("https://twitter.com/intent/tweet?text="+encodeURIComponent(t),"_blank");
}

/* ===================== エリアチップ ===================== */
function paintChips(){
  $("chips").innerHTML=AREAS.map(function(a){
    var on=(a==="全て"&&!areaFilter)||areaFilter===a;
    return '<button class="'+(on?"on":"")+'" onclick="setArea(\''+a+'\')">'+a+'</button>';
  }).join("");
}
function setArea(a){
  areaFilter=(a==="全て")?"":a;
  paintChips();paintCoList();paintMap();
}

<script>
(function () {
  /* TikTokのID（@は付けない） */
  var TIKTOK_ID = "dnud.jp";

  /* 営業スケジュール  0=日 1=月 2=火 3=水 4=木 5=金 6=土 */
  var SCHEDULE = {
    0: { open: false, until: 6 },
    1: { open: true,  until: 6 },
    2: { open: true,  until: 6 },
    3: { open: true,  until: 6 },
    4: { open: false, until: 6 },
    5: { open: true,  until: 7 },
    6: { open: true,  until: 7 }
  };
  var START_HOUR = 21;

  var el = document.getElementById("dnudLive");
  if (!el) return;
  el.href = "https://www.tiktok.com/@" + TIKTOK_ID + "/live";

  var param = new URLSearchParams(location.search).get("live");
  if (param === "on" || param === "off" || param === "auto") {
    try { localStorage.setItem("dnudLive", param); } catch (e) {}
  }
  var override = "auto";
  try { override = localStorage.getItem("dnudLive") || "auto"; } catch (e) {}

  function isOpen() {
    var now = new Date(), hh = now.getHours(), day = now.getDay();
    if (hh >= START_HOUR) return SCHEDULE[day].open;
    var prev = (day + 6) % 7, rule = SCHEDULE[prev];
    return rule.open && hh < rule.until;
  }
  function update() {
    var show = override === "on" ? true : override === "off" ? false : isOpen();
    el.setAttribute("data-visible", show ? "true" : "false");
  }
  update();
  setInterval(update, 60000);
})();
</script>
