<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>代行なうアプリ｜福岡の運転代行を地図から呼ぶ</title>
<meta name="description" content="中洲・天神・博多の運転代行を地図から呼べます。空車の代行が地図上に表示され、料金は呼ぶ前にわかります。">
<meta name="theme-color" content="#0B1220">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:site_name" content="代行なうアプリ">
<meta property="og:title" content="代行なうアプリ｜福岡の運転代行を地図から呼ぶ">
<meta property="og:description" content="地図から呼べる運転代行。空車がひと目でわかります。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://daikounaw.com/app">

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=AW-17580686224"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'AW-17580686224');

  /* 電話番号がタップされたときにコンバージョンを送信 */
  document.addEventListener('click', function(e){
    var t = e.target;
    while (t && t !== document) {
      if (t.tagName === 'A' && (t.getAttribute('href')||'').indexOf('tel:') === 0) {
        gtag('event', 'conversion', {
          'send_to': 'AW-17580686224/SImfCIiF4-YcEJD3j79B',
          'value': 1900.0,
          'currency': 'JPY'
        });
        return;
      }
      t = t.parentNode;
    }
  }, true);
</script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<style>
:root{
  --bg:#0B1220; --surface:#142338; --surface-2:#1B2E48; --line:#22385A;
  --text:#E8EEF7; --muted:#8FA3BF; --amber:#FFB020; --green:#2ECC71; --blue:#5A96FF;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  font-feature-settings:"palt"; height:100dvh; position:relative;
}
#map{position:absolute;inset:0;z-index:0;background:#0a0f1c}
.leaflet-container{background:#0a0f1c}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* 上部バー */
.top{
  position:absolute;left:0;right:0;top:0;z-index:400;
  padding:calc(12px + env(safe-area-inset-top)) 16px 22px;
  background:linear-gradient(180deg,rgba(11,18,32,.94) 0%,rgba(11,18,32,.72) 55%,transparent 100%);
  display:flex;align-items:center;gap:11px;
}
.logo{font-size:17px;font-weight:800;letter-spacing:-.01em}
.logo em{font-style:normal;color:var(--amber)}
.pill{
  display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;
  background:rgba(20,35,56,.86);border:1px solid var(--line);border-radius:999px;padding:7px 11px;
}
.pill i{width:6px;height:6px;border-radius:50%;background:var(--green);animation:bl 1.8s infinite;font-style:normal}
.pill.off i{background:var(--muted);animation:none}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.25}}
.top .menu{margin-left:auto;display:flex;gap:8px}
.top .menu a{
  font-size:11.5px;font-weight:800;color:var(--muted);text-decoration:none;
  background:rgba(20,35,56,.86);border:1px solid var(--line);border-radius:999px;padding:8px 12px;
}
.top .menu a.tel{color:#241400;background:var(--amber);border-color:var(--amber)}

/* 中央ピン */
#cross{position:absolute;left:50%;top:calc(50% - 90px);z-index:390;
  transform:translate(-50%,-100%);pointer-events:none;text-align:center}
#cross .pin{
  width:32px;height:32px;border-radius:50% 50% 50% 0;background:var(--amber);
  transform:rotate(-45deg);box-shadow:0 5px 16px rgba(0,0,0,.6);margin:0 auto;
}
#cross .pin::after{content:'';display:block;width:11px;height:11px;border-radius:50%;
  background:#241400;margin:10.5px 0 0 10.5px}
#cross .lbl{
  margin-top:9px;font-size:11.5px;font-weight:800;color:var(--text);
  background:rgba(11,18,32,.82);border:1px solid var(--line);border-radius:999px;
  padding:5px 11px;white-space:nowrap;display:inline-block;
}

/* ティッカー（掲示板） */
.tick{
  position:absolute;left:12px;right:12px;z-index:400;
  bottom:calc(var(--sheetH,286px) + 12px);
  background:rgba(20,35,56,.9);backdrop-filter:blur(12px);
  border:1px solid var(--line);border-radius:13px;
  padding:11px 13px;display:flex;align-items:center;gap:10px;
  animation:fade .45s ease-out;
}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.tick .bd{flex:none;width:7px;height:7px;border-radius:50%;background:var(--amber);animation:bl 1.6s infinite}
.tick .bd.a{background:var(--blue);animation:none}
.tick .bd.d{background:var(--line);animation:none}
.tick .t{flex:1;min-width:0;font-size:13px;font-weight:800;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tick .t i{font-style:normal;color:var(--muted);margin:0 5px}
.tick .y{flex:none;font-size:12.5px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}

/* 下部シート */
.sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:410;
  background:var(--surface);border-top:1px solid var(--line);
  border-radius:22px 22px 0 0;box-shadow:0 -14px 34px rgba(0,0,0,.5);
  padding:12px 0 calc(14px + env(safe-area-inset-bottom));
}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.shd{display:flex;align-items:baseline;gap:8px;padding:0 16px 10px}
.shd h2{font-size:13px;font-weight:800;margin:0;letter-spacing:.03em}
.shd span{font-size:11px;color:var(--muted);font-weight:700}
.shd a{margin-left:auto;font-size:11.5px;font-weight:800;color:var(--muted);text-decoration:none}

.rail{display:flex;gap:9px;overflow-x:auto;padding:0 16px 13px;
  scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.rail::-webkit-scrollbar{display:none}
.cc{
  scroll-snap-align:start;flex:none;width:170px;cursor:pointer;
  background:var(--surface-2);border:1px solid var(--line);border-radius:13px;padding:12px;
}
.cc.live{border-color:rgba(46,204,113,.5)}
.cc.sel{border-color:var(--amber);background:rgba(255,176,32,.09)}
.cc .n{font-size:13.5px;font-weight:800;line-height:1.35;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc .s{margin-top:7px;font-size:12px;font-weight:800;color:var(--green)}
.cc .s.off{color:var(--muted)}
.cc .s em{font-style:normal;font-size:10.5px;color:var(--muted);margin-left:6px;font-weight:700}
.cc .r{margin-top:6px;font-size:10.5px;color:var(--muted);font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.railEmpty{padding:4px 16px 14px;font-size:12px;color:var(--muted);font-weight:700;line-height:1.7}

.go{
  display:block;margin:0 16px;text-decoration:none;text-align:center;
  background:var(--amber);color:#241400;border-radius:16px;padding:19px;
  font-size:18px;font-weight:800;letter-spacing:.03em;
  box-shadow:0 12px 30px rgba(255,176,32,.2);transition:transform .12s;
}
.go:active{transform:scale(.985)}
.go small{display:block;font-size:11px;font-weight:700;opacity:.62;margin-top:4px}
.callrow{
  display:block;margin:9px 16px 0;text-decoration:none;text-align:center;
  background:var(--surface-2);border:1px solid var(--line);color:var(--green);
  border-radius:14px;padding:15px;font-size:15px;font-weight:800;
}
.foot{padding:11px 16px 0;font-size:10.5px;color:var(--muted);opacity:.6;
  font-weight:600;line-height:1.7;text-align:center}
.foot a{color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<h1 class="sr">代行なう｜福岡・中洲・天神・博多の運転代行を地図から呼べるアプリ</h1>

<div id="map"></div>

<div class="top">
  <div class="logo">代行<em>なう</em></div>
  <div class="pill" id="pill"><i></i><span id="pillTxt">読み込み中</span></div>
  <div class="menu">
    <a href="sagasu.html">探す</a>
    <a class="tel" href="tel:05017243179">電話</a>
  </div>
</div>

<div id="cross"><div class="pin"></div><div class="lbl">ここに呼びます</div></div>

<div class="tick" id="tick" style="display:none">
  <span class="bd" id="tBd"></span>
  <div class="t" id="tTxt"></div>
  <div class="y" id="tYen"></div>
</div>

<div class="sheet" id="sheet">
  <div class="grab"></div>
  <div class="shd">
    <h2>いま呼べる代行</h2><span id="cnt"></span>
    <a href="sagasu.html">一覧で見る</a>
  </div>
  <div class="rail" id="rail"></div>
  <a class="go" id="go" href="yobu.html">この場所に代行を呼ぶ<small>地図でタップ・料金は先にわかる</small></a>
  <a class="callrow" href="tel:05017243179">電話で呼ぶ　050-1724-3179</a>
  <div class="foot">料金は業者ごとに異なります　
    <a href="touroku.html">運転代行業者の方はこちら</a>　·　
    <a href="rireki.html">ご利用履歴</a></div>
</div>

<script>
var SB="https://kjfmcpwstubgezebmstt.supabase.co/rest/v1/";
var SK="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtqZm1jcHdzdHViZ2V6ZWJtc3R0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1ODU3MTksImV4cCI6MjA5NDE2MTcxOX0.GF5QPVI4AUCfIqdmApplwOAEDBoESZTfadi-hbOb7Gs";
var H={"apikey":SK,"Authorization":"Bearer "+SK};
var $=function(id){return document.getElementById(id);};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

var map=L.map('map',{zoomControl:false,attributionControl:false}).setView([33.5902,130.4017],15);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{maxZoom:19}).addTo(map);
L.control.attribution({prefix:false}).addAttribution('&copy; OpenStreetMap, CARTO').addTo(map);

navigator.geolocation && navigator.geolocation.getCurrentPosition(function(p){
  map.setView([p.coords.latitude,p.coords.longitude],16);
}, function(){}, {enableHighAccuracy:true,timeout:8000});

function sheetH(){
  document.documentElement.style.setProperty('--sheetH', $('sheet').offsetHeight+'px');
}
window.addEventListener('resize', sheetH);

/* 中心座標を常にリンクへ反映 */
var selId=null, selName='';
function paintGo(){
  var c=map.getCenter();
  var q='yobu.html?lat='+c.lat.toFixed(6)+'&lng='+c.lng.toFixed(6)+(selId?'&co='+encodeURIComponent(selId):'');
  $('go').href=q;
  $('go').innerHTML = selId
    ? esc(selName)+'を指名して呼ぶ<small>90秒間この業者が優先して受注します</small>'
    : 'この場所に代行を呼ぶ<small>地図でタップ・料金は先にわかる</small>';
}
map.on('move', paintGo);

function liveMin(c){
  if (!c.appeal_until) return 0;
  var m=Math.ceil((new Date(c.appeal_until).getTime()-Date.now())/60000);
  return m>0?m:0;
}
function carIcon(live){
  var col=live?'#2ECC71':'#8FA3BF';
  return L.divIcon({className:'',iconSize:[22,22],iconAnchor:[11,11],
    html:'<div style="width:22px;height:22px;border-radius:50%;background:'+col+
      ';border:3px solid #0B1220;box-shadow:0 0 0 '+(live?'6px':'3px')+' '+col+'33"></div>'});
}

var marks={}, cos=[];
async function loadCos(){
  try{
    var r=await fetch(SB+'companies?select=*',{headers:H});
    cos=await r.json(); if(!Array.isArray(cos)) return;

    cos.sort(function(a,b){
      var al=(liveMin(a)>0&&(a.free_cars||0)>0)?1:0, bl=(liveMin(b)>0&&(b.free_cars||0)>0)?1:0;
      if (bl!==al) return bl-al;
      if ((b.is_open?1:0)!==(a.is_open?1:0)) return (b.is_open?1:0)-(a.is_open?1:0);
      return (b.sort_weight||0)-(a.sort_weight||0);
    });

    var live=cos.filter(function(c){return liveMin(c)>0&&(c.free_cars||0)>0;}).length;
    var open=cos.filter(function(c){return c.is_open;}).length;
    $('pill').className='pill'+(open?'':' off');
    $('pillTxt').textContent = live? '空車'+live+'社が待機中' : (open? open+'社が受付中' : 'ただいま受付停止中');
    $('cnt').textContent = live? live+'社が空車' : (open? open+'社が受付中' : '');

    /* 地図上のマーカー */
    cos.forEach(function(c){
      if (!c.lat||!c.lng) return;
      var lv=(liveMin(c)>0&&(c.free_cars||0)>0);
      if (marks[c.id]) { marks[c.id].setLatLng([c.lat,c.lng]); marks[c.id].setIcon(carIcon(lv)); }
      else {
        marks[c.id]=L.marker([c.lat,c.lng],{icon:carIcon(lv)}).addTo(map);
        marks[c.id].on('click',function(){ select(c.id); });
      }
    });

    $('rail').innerHTML = cos.length ? cos.slice(0,8).map(function(c){
      var lm=liveMin(c), free=c.free_cars||0, lv=(lm>0&&free>0);
      return '<div class="cc'+(lv?' live':'')+(selId===c.id?' sel':'')+'" data-id="'+esc(c.id)+'">'+
        '<div class="n">'+esc(c.name)+'</div>'+
        '<div class="s'+(lv?'':' off')+'">'+
          (lv?'空車'+free+'台<em>あと'+lm+'分</em>':(c.is_open?'受付中':'受付停止中'))+'</div>'+
        '<div class="r">'+esc(c.price_note||'料金はお問い合わせください')+'</div>'+
      '</div>';
    }).join('') : '<div class="railEmpty">現在お呼びできる業者がいません。</div>';

    var cards=$('rail').querySelectorAll('.cc');
    for (var i=0;i<cards.length;i++){
      (function(el){ el.onclick=function(){ select(el.getAttribute('data-id')); }; })(cards[i]);
    }
    sheetH();
  }catch(e){}
}

function select(id){
  selId = (selId===id) ? null : id;
  var c=cos.filter(function(x){return x.id===selId;})[0];
  selName = c? c.name : '';
  if (c && c.lat && c.lng) map.panTo([c.lat,c.lng],{animate:true});
  var cards=$('rail').querySelectorAll('.cc');
  for (var i=0;i<cards.length;i++){
    var el=cards[i], on=(el.getAttribute('data-id')===selId);
    el.className='cc'+(el.className.indexOf('live')>=0?' live':'')+(on?' sel':'');
  }
  paintGo();
}

/* 掲示板ティッカー */
function area(s){
  if (!s) return '福岡市内';
  var t=String(s).split(/[（(]/)[0].split(/[\s　]/)[0];
  t=t.replace(/[0-9０-９]+丁目.*$/,'').replace(/[0-9０-９\-−ー]+$/,'');
  return t.length>1 ? t : '福岡市内';
}
function rel(iso){
  var m=Math.max(0,Math.floor((Date.now()-new Date(iso).getTime())/60000));
  return m<1?'たった今':m<60?m+'分前':Math.floor(m/60)+'時間前';
}
var feed=[], fi=0;
async function loadFeed(){
  try{
    var r=await fetch(SB+'orders?select=id,pickup,dropoff,price,status,created_at&order=created_at.desc&limit=6',{headers:H});
    var d=await r.json();
    feed=Array.isArray(d)?d:[];
    showTick();
  }catch(e){}
}
function showTick(){
  if (!feed.length){ $('tick').style.display='none'; return; }
  var o=feed[fi % feed.length];
  var k = o.status==='open' ? ['','募集中']
        : o.status==='done' ? ['d','完了']
        : ['a', o.status==='arriving'?'運行中':'お迎え中'];
  $('tBd').className='bd '+k[0];
  $('tTxt').innerHTML=esc(area(o.pickup))+'<i>→</i>'+esc(area(o.dropoff))+
    ' <i>'+k[1]+'・'+rel(o.created_at)+'</i>';
  $('tYen').textContent=o.price?Number(o.price).toLocaleString()+'円':'';
  var t=$('tick');
  t.style.display='flex';
  t.style.animation='none'; void t.offsetWidth; t.style.animation='fade .45s ease-out';
  fi++;
  sheetH();
}

paintGo(); sheetH();
loadCos(); loadFeed();
setInterval(loadCos, 25000);
setInterval(loadFeed, 30000);
setInterval(showTick, 5000);
</script>
</body>
</html>
