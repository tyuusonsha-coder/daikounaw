<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>運転代行｜代行NOW</title>
<meta name="description" content="代行NOW掲載の運転代行業者のページです。料金・対応エリア・営業時間を確認して、そのまま電話で呼べます。">
<meta name="theme-color" content="#0B1220">
<link rel="canonical" id="canon" href="https://daikounaw.com/g.html">
<style>
:root{
  --bg:#0B1220; --surface:#142338; --surface-2:#1B2E48; --line:#22385A;
  --text:#E8EEF7; --muted:#8FA3BF; --amber:#FFB020; --green:#2ECC71; --red:#FF5A5A;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text)}
body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;line-height:1.7;
  padding:env(safe-area-inset-top,0px) 0 calc(96px + env(safe-area-inset-bottom,0px))}
a{color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px}
.top{padding:28px 18px 22px;border-bottom:1px solid var(--line);max-width:560px;margin:0 auto}
.status{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;padding:4px 12px;border-radius:999px;background:var(--surface-2)}
.status i{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.status.open i{background:var(--green);box-shadow:0 0 0 4px rgba(46,204,113,.18)}
.status.open{color:var(--green)}
h1{font-size:28px;line-height:1.3;margin:14px 0 6px;letter-spacing:.02em}
.where{color:var(--muted);font-size:14px}
.price{margin:22px 0 4px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.price b{font-size:40px;color:var(--amber);line-height:1}
.price span{color:var(--muted);font-size:14px}
.pnote{font-size:14px;color:var(--text);margin-top:6px}
.cert{margin-top:16px;font-size:13px;color:var(--muted);border-left:3px solid var(--amber);padding-left:10px}
.cert strong{color:var(--text);font-weight:700}
.news{margin-top:18px;background:var(--surface);border-radius:12px;padding:12px 14px;font-size:14px}
.news small{display:block;color:var(--muted);font-size:12px}
dl{margin-top:8px}
dl div{display:grid;grid-template-columns:92px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);font-size:15px}
dt{color:var(--muted);font-size:13px;padding-top:2px}
dd{word-break:break-word}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips em{font-style:normal;font-size:13px;background:var(--surface-2);padding:2px 10px;border-radius:6px}
.more{display:block;margin-top:22px;padding:14px;border:1px solid var(--line);border-radius:12px;text-align:center;text-decoration:none;font-weight:700}
.portal{margin-top:34px;padding:18px;background:var(--surface);border-radius:14px;font-size:14px;color:var(--muted)}
.portal a{color:var(--amber);font-weight:700}
.portal p+p{margin-top:8px}
.foot{margin-top:24px;font-size:12px;color:var(--muted);text-align:center}
.dock{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));
  background:rgba(11,18,32,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.dock .in{max-width:560px;margin:0 auto;display:flex;gap:10px}
.call{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:58px;border-radius:14px;
  background:var(--amber);color:#1A1200;text-decoration:none;font-weight:800;font-size:18px;line-height:1.2}
.call small{font-size:12px;font-weight:600;opacity:.8}
.lineb{width:86px;display:flex;align-items:center;justify-content:center;border-radius:14px;background:#06C755;color:#fff;text-decoration:none;font-weight:800}
a:focus-visible{outline:3px solid var(--text);outline-offset:2px}
.empty{padding:60px 18px;text-align:center;color:var(--muted)}
.empty a{color:var(--amber)}
</style>
</head>
<body>

<div id="app"><div class="empty">読み込んでいます…</div></div>

<script>
var SB="https://kjfmcpwstubgezebmstt.supabase.co/rest/v1/";
var SK="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtqZm1jcHdzdHViZ2V6ZWJtc3R0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1ODU3MTksImV4cCI6MjA5NDE2MTcxOX0.GF5QPVI4AUCfIqdmApplwOAEDBoESZTfadi-hbOb7Gs";
var H={"apikey":SK,"Authorization":"Bearer "+SK};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}
function yen(n){return Number(n).toLocaleString("ja-JP");}
function telOf(p){return String(p||"").replace(/[^0-9+]/g,"");}
function lineUrl(l){l=String(l||"").trim(); if(!l) return ""; if(/^https?:\/\//.test(l)) return l; return "https://line.me/R/ti/p/"+encodeURIComponent(l.charAt(0)==="@"?l:"@"+l);}

var id=new URLSearchParams(location.search).get("id");

function notFound(){
  document.getElementById("app").innerHTML='<div class="empty"><p>この業者のページは見つかりませんでした。</p><p style="margin-top:12px"><a href="sagasu.html">代行NOWで近くの業者を探す</a></p></div>';
}

async function load(){
  if(!id){ notFound(); return; }
  try{
    var r=await fetch(SB+"companies?select=*&id=eq."+encodeURIComponent(id),{headers:H});
    var a=await r.json();
    if(!a||!a.length){ notFound(); return; }
    render(a[0]);
  }catch(e){
    document.getElementById("app").innerHTML='<div class="empty">読み込めませんでした。電波の良い場所で再読み込みしてください。</div>';
  }
}

function render(c){
  var place=[c.pref,c.area].filter(Boolean).join(" ");
  var areas=Array.isArray(c.areas)?c.areas.filter(Boolean):[];
  var pays=Array.isArray(c.pay_methods)?c.pay_methods.filter(Boolean):[];
  var tel=telOf(c.phone), ln=lineUrl(c.line);

  document.title=c.name+(place?"｜"+place+"の運転代行":"｜運転代行")+"｜代行NOW";
  document.querySelector('meta[name="description"]').setAttribute("content",
    c.name+"の料金・対応エリア・営業時間。"+(place?place+"で":"")+"運転代行を呼ぶなら電話1本で。");
  document.getElementById("canon").href="https://daikounaw.com/g.html?id="+encodeURIComponent(c.id);

  var price='';
  if(c.base_fare!=null){
    price='<div class="price"><b>'+yen(c.base_fare)+'円</b><span>初乗り'+(c.per_km!=null?'／以降1kmごと'+yen(c.per_km)+'円':'')+'</span></div>';
  }
  if(c.price_note) price+='<p class="pnote">'+esc(c.price_note)+'</p>';
  if(!price) price='<p class="pnote">料金はお電話でお問い合わせください</p>';

  var cert='';
  if(c.license_no) cert='<p class="cert">公安委員会認定 <strong>'+esc(c.license_no)+'</strong></p>';
  else if(c.certified) cert='<p class="cert">公安委員会の認定を受けた業者です</p>';

  var news='';
  if(c.news_title){
    var d=c.news_at?new Date(c.news_at):null;
    news='<div class="news"><small>'+(d?(d.getMonth()+1)+"月"+d.getDate()+"日のお知らせ":"お知らせ")+'</small>'+esc(c.news_title)+'</div>';
  }

  var rows='';
  if(areas.length||c.area) rows+='<div><dt>対応エリア</dt><dd>'+(areas.length?'<span class="chips">'+areas.map(function(x){return '<em>'+esc(x)+'</em>';}).join("")+'</span>':esc(c.area))+'</dd></div>';
  if(c.hours) rows+='<div><dt>営業時間</dt><dd>'+esc(c.hours)+'</dd></div>';
  if(c.phone) rows+='<div><dt>電話番号</dt><dd><a href="tel:'+esc(tel)+'">'+esc(c.phone)+'</a></dd></div>';
  if(pays.length) rows+='<div><dt>お支払い</dt><dd>'+esc(pays.join("、"))+'</dd></div>';
  if(c.free_cars) rows+='<div><dt>待機台数</dt><dd>'+esc(c.free_cars)+'台</dd></div>';

  var html=
   '<header class="top">'+
     '<span class="status'+(c.is_open?' open':'')+'"><i></i>'+(c.is_open?'ただいま営業中':'営業時間外')+'</span>'+
     '<h1>'+esc(c.name)+'</h1>'+
     (place?'<p class="where">'+esc(place)+'の運転代行</p>':'')+
     price+cert+news+
   '</header>'+
   '<main class="wrap">'+
     (rows?'<dl>'+rows+'</dl>':'')+
     '<a class="more" href="yobu.html?co='+encodeURIComponent(c.id)+'">アプリで迎車を依頼する</a>'+
     '<section class="portal">'+
       '<p>このページは運転代行ポータル「代行NOW」に掲載されています。</p>'+
       '<p><a href="sagasu.html">ほかの業者も探す</a></p>'+
       '<p>運転代行業者の方は、同じページを無料で作れます。<a href="touroku.html">無料で掲載する</a></p>'+
     '</section>'+
     '<p class="foot">運営：合同会社中尊社（代行NOW）</p>'+
   '</main>'+
   '<nav class="dock"><div class="in">'+
     (tel?'<a class="call" href="tel:'+esc(tel)+'">電話で呼ぶ<small>'+esc(c.phone)+'</small></a>':'')+
     (ln?'<a class="lineb" href="'+esc(ln)+'" target="_blank" rel="noopener">LINE</a>':'')+
   '</div></nav>';
  document.getElementById("app").innerHTML=html;

  var ld={"@context":"https://schema.org","@type":"LocalBusiness","name":c.name,
    "url":"https://daikounaw.com/g.html?id="+encodeURIComponent(c.id),"telephone":c.phone||undefined,
    "address":place?{"@type":"PostalAddress","addressRegion":c.pref||undefined,"addressLocality":c.area||undefined,"addressCountry":"JP"}:undefined,
    "areaServed":areas.length?areas:undefined,"openingHours":c.hours||undefined,
    "description":(place?place+"の":"")+"運転代行"+(c.license_no?"（公安委員会認定 "+c.license_no+"）":"")};
  if(c.rating_count>0&&c.rating_avg!=null) ld.aggregateRating={"@type":"AggregateRating","ratingValue":Number(c.rating_avg),"ratingCount":c.rating_count};
  var s=document.createElement("script"); s.type="application/ld+json"; s.textContent=JSON.stringify(ld); document.head.appendChild(s);
}
load();
</script>
</body>
</html>
